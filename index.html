<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>New tab</title>
    <style>
        *{user-select:none;}
        body {
            background-image: url('bg.png');
            background-size: cover; 
            background-repeat: no-repeat; 
            font-family: monospace, sans-serif;
            display: flex;
            flex-direction: column; /* Stack all elements vertically */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            padding-inline: 50px;
            padding-left: 200px;
            
        }

        .flex-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            padding: 10px;
            background-color: #ffffff00;
            border-radius: 5px;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px; /* Space between blocks */
        }

        .flex-cell {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .flex-cell:hover {
            background-color: #92ff9b;
        }

        .flex-cell .title {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        @media (max-width: 768px) {
            .flex-container {
                padding-inline: 20px;
            }
        }

        @media (max-width: 480px) {
            .flex-cell {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div id="main-container"></div>

    <script type="module">
        //refactor 2h37min
        import { data } from './data.js';

        const codeLookup = {};
        let idCounter = 1;

        function normalizeCode(raw) {
            if (Array.isArray(raw)) {
                return raw.join('\n');
            }
            return typeof raw === 'string' ? raw : '';
        }

        function copyText(id) {
            const textToCopy = codeLookup[id] || '';
            if (!textToCopy) return;

            navigator.clipboard.writeText(textToCopy)
                .then(() => {
                    alert('Copied to clipboard');
                })
                .catch(err => {
                    console.error('Failed to copy: ', err);
                });
        }


        const mainContainer = document.getElementById('main-container');

        data.groups.forEach(group => {
            const flexContainer = document.createElement('div');
            flexContainer.className = 'flex-container';

            group.forEach(item => {
                const flexCell = document.createElement('div');
                flexCell.className = 'flex-cell';

                const itemId = `p${idCounter++}`;
                codeLookup[itemId] = normalizeCode(item.code);

                flexCell.addEventListener('click', () => copyText(itemId));

                const title = document.createElement('div');
                title.className = 'title';
                title.textContent = item.title;

                flexCell.appendChild(title);
                flexContainer.appendChild(flexCell);
            });

            mainContainer.appendChild(flexContainer);
        });
    </script>
</body>
</html>
