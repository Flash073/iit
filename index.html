class hashTable:
    def __init__(self, collision_method="linear"):
        self.size = int(input("Enter the Size of the hash table: "))
        self.table = [None] * self.size
        self.elementCount = 0
        self.comparisons = 0
        self.collision_method = collision_method  # Choose between "linear" and "quadratic"

    def isFull(self):
        return self.elementCount == self.size

    def hashFunction(self, element):
        return element % self.size

    def insert(self, record):
        if self.isFull():
            print("Hash Table Full")
            return False

        position = self.hashFunction(record.get_number())
        comparisons = 0
        original_position = position
        i = 0

        while self.table[position] is not None:
            comparisons += 1
            if self.collision_method == "linear":
                position = (original_position + i) % self.size
                i += 1
            elif self.collision_method == "quadratic":
                position = (original_position + i ** 2) % self.size
                i += 1
            if i >= self.size:  # All slots checked
                print("Unable to insert, hash table full.")
                return False

        self.table[position] = record
        print(f"Number inserted at position {position}")
        self.elementCount += 1
        self.comparisons += comparisons
        return True

    def search(self, number):
        position = self.hashFunction(number)
        comparisons = 0
        original_position = position
        i = 0

        while self.table[position] is not None:
            comparisons += 1
            if self.table[position].get_number() == number:
                print(f"Record found at position {position}: {self.table[position]}")
                print(f"Comparisons made: {comparisons}")
                return self.table[position]
            if self.collision_method == "linear":
                position = (original_position + i) % self.size
                i += 1
            elif self.collision_method == "quadratic":
                position = (original_position + i ** 2) % self.size
                i += 1
            if i >= self.size:  # All slots checked
                break

        print("Record not found!")
        print(f"Comparisons made: {comparisons}")
        return None

    def display(self):
        print("\nHash Table:")
        for i, record in enumerate(self.table):
            print(f"Hash Value: {i}\t\t{record}")
        print(f"Total Records: {self.elementCount}")

    {

      return NULL;
    }

  if (strcmp(x,root->kwd)<0 )

	void heapify(int arr[], int n, int i)
	{
		int largest = i; // Initialize largest as root
		int l = 2 * i + 1; // left = 2*i + 1
		int r = 2 * i + 2; // right = 2*i + 2

		// If left child is larger than root

		if (r < n && arr[r] > arr[largest])

			int swap = arr[i];
			arr[i] = arr[largest];
			arr[largest] = swap;

			// Recursively heapify the affected sub-tree
			heapify(arr, n, largest);
		}
	}
